name: Kaygan

options:
  bundleIdPrefix: com.aerz
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"

settings:
  base:
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    DEAD_CODE_STRIPPING: YES
    DEVELOPMENT_TEAM: X8YMM69L75
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

schemes:
  Kaygan:
    build:
      targets:
        Kaygan: all
    run:
      config: Debug
    archive:
      config: Release
    management:
      shared: true

targets:
  Kaygan:
    type: application
    platform: macOS
    sources:
      - path: Kaygan
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        DEAD_CODE_STRIPPING: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Kaygan/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: Kaygan
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        MARKETING_VERSION: "0.1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.aerz.Kaygan
        SWIFT_VERSION: "6.0"
